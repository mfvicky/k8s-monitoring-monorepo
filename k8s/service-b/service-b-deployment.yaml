apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: monitoring-app
  labels:
    app: service-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: service-b:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
              name: metrics
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: '$(SERVICE_B_PORT)'
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
